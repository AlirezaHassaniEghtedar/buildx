name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # R19: پایتون‌های پشتیبانی‌شده — 3.13 همان نسخه‌ای است که کاربران ویندوز دارند
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: botforge
          POSTGRES_PASSWORD: botforge
          POSTGRES_DB: botforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U botforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # حداقل ۳۲ بایت؛ مقدار قبلی ۲۷ بایت بود و باعث ValidationError می‌شد
      SECRET_KEY: ci-secret-key-0123456789-abcdefghijklmnop
      FERNET_KEY: ""
      # alembic upgrade head روی دیتابیس اصلی
      DATABASE_URL: postgresql+asyncpg://botforge:botforge@localhost:5432/botforge
      # تست‌های concurrency روی دیتابیس جدا تا schema مهاجرت‌شده را drop_all نکنند
      DATABASE_URL_TEST_PG: postgresql+asyncpg://botforge:botforge@localhost:5432/botforge_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Create test database
        run: |
          PGPASSWORD=botforge psql -h localhost -U botforge -d botforge \
            -c "CREATE DATABASE botforge_test;" || true
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest -q

  # R19: اجرای روی ویندوز با همان پایتون کاربران (3.12 و 3.13) — بدون Postgres؛
  # تست‌های pg با نشانگر صریح رد می‌شوند (ALLOW_MISSING_PG=1 سکوت نیست، مستند است).
  api-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/api
        shell: pwsh
    env:
      SECRET_KEY: ci-secret-key-0123456789-abcdefghijklmnop
      FERNET_KEY: ""
      # این جاب سرویس Postgres ندارد؛ تست‌های pg با -m "not pg" رد می‌شوند
      ALLOW_MISSING_PG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy app
      # روی SQLite (مسیر نسبی باید نسبت به apps/api حل شود — R16)
      - run: alembic upgrade head
      - run: pytest -q -m "not pg"
      - name: Smoke uvicorn from repo root
        working-directory: .
        run: |
          $proc = Start-Process -PassThru -NoNewWindow python `
            -ArgumentList "-m","uvicorn","app.main:app","--app-dir","apps/api","--port","8765"
          $ok = $false
          foreach ($i in 1..20) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8765/healthz
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          taskkill /F /T /PID $proc.Id 2>$null
          if (-not $ok) { Write-Error "healthz از ریشهٔ ریپو 200 نشد"; exit 1 }
          Write-Host "healthz (repo root) = 200"
      - name: Smoke uvicorn from apps/api
        working-directory: apps/api
        run: |
          $proc = Start-Process -PassThru -NoNewWindow python `
            -ArgumentList "-m","uvicorn","app.main:app","--port","8766"
          $ok = $false
          foreach ($i in 1..20) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:8766/healthz
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          taskkill /F /T /PID $proc.Id 2>$null
          if (-not $ok) { Write-Error "healthz از apps/api 200 نشد"; exit 1 }
          Write-Host "healthz (apps/api) = 200"

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build api image
        run: docker build -f deploy/api.Dockerfile -t botforge-api .
      - name: Build web image
        run: docker build -f deploy/web.Dockerfile -t botforge-web .
