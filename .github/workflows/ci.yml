name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: botforge
          POSTGRES_PASSWORD: botforge
          POSTGRES_DB: botforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U botforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://botforge:botforge@localhost:5432/botforge
      SECRET_KEY: ci-secret-key-ci-secret-key
      FERNET_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy app
      - run: pytest -q
