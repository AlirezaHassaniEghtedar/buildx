[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botforge-api"
version = "0.1.0"
description = "BotForge — AI agent that builds, tests and publishes Persian Telegram/Bale bots"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.5",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "cryptography>=43",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "structlog>=24.4",
  "jdatetime>=5.0",
  "langgraph>=0.2.45",
  "PyYAML>=6.0",
  "types-PyYAML",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "aiosqlite>=0.20",
  "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "pg: به Postgres واقعی نیاز دارد (DATABASE_URL_TEST_PG)؛ جاب‌های CI بدون PG با ALLOW_MISSING_PG=1 و -m 'not pg' رد می‌شوند",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = false
